name: Assemble CabinetDrafter index

on:
  push:
    paths:
      - '.build-parts/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble index.html
        run: |
          cat .build-parts/part-* > index.html
          rm -rf .build-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish CabinetDrafter 1.1.1 web app"
          git push
